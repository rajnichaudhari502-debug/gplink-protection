<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Gateway</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; padding: 2.5rem 2rem; border-radius: 16px; text-align: center; max-width: 450px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        h2 { margin-bottom: 10px; font-size: 1.5rem; color: #38bdf8; }
        p { margin-bottom: 20px; font-size: 0.95rem; color: #94a3b8; line-height: 1.4; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; font-size: 0.95rem; }
        .cf-wrapper { display: flex; justify-content: center; margin-bottom: 20px; }
        .btn { display: none; width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-decoration: none; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); transition: background 0.2s; }
        .btn:hover { background: #16a34a; }
        .admin-btn { background: #3b82f6; display: block; margin-top: 10px; }
        .admin-btn:hover { background: #2563eb; }
        .hidden { display: none !important; }
        .result-box { background: #0f172a; padding: 10px; border-radius: 6px; word-break: break-all; font-size: 0.85rem; color: #38bdf8; margin-top: 10px; border: 1px dashed #475569; }
    </style>
</head>
<body>

    <!-- USER VIEW: CAPTCHA GATE -->
    <div id="user-view" class="card">
        <h2>Human Check</h2>
        <p>Please complete the verification below to launch Telegram and retrieve your file.</p>
        
        <div class="cf-wrapper">
            <!-- PASTE YOUR CLOUDFLARE SITE KEY HERE -->
            <div class="cf-turnstile" data-sitekey="YOUR_CLOUDFLARE_SITE_KEY" data-callback="onSuccess"></div>
        </div>
        
        <a id="tg-btn" class="btn" href="#">Open Telegram App</a>
    </div>

    <!-- ADMIN VIEW: ACCESSED VIA /admin or #admin -->
    <div id="admin-view" class="card hidden">
        <h2>Admin Link Generator</h2>
        <p>Generate protected GPLinks instantly.</p>
        
        <div id="login-box">
            <input type="password" id="admin-pass" placeholder="Enter Admin Password">
            <button class="btn admin-btn" style="display:block;" onclick="verifyAdmin()">Login</button>
        </div>

        <div id="generator-box" class="hidden">
            <input type="text" id="tg-link" placeholder="Paste Telegram Bot Link (e.g., https://t.me/Bot?start=xyz)">
            <button class="btn admin-btn" style="display:block;" onclick="generateGPLink()">Generate Secure GPLink</button>
            <div id="output" class="result-box hidden"></div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "123gplinksecured"; // <-- Change to your admin password
        const GPLINKS_API_KEY = "cc346941b13df1daa7da298d55231228fa92b359";   // <-- Put your GPLinks API Key here
        const BOT_USERNAME = "@Atoz_12_FileStore_Bot";   // <-- Put your Public Clone Bot username (without @)

        // Detects if you open /admin or #admin
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash === '#admin' || window.location.pathname.includes('admin')) {
                document.getElementById('user-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
            }
        });

        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('generator-box').classList.remove('hidden');
            } else {
                alert('Incorrect Password!');
            }
        }

        async function generateGPLink() {
            const rawTgLink = document.getElementById('tg-link').value.trim();
            if (!rawTgLink) {
                alert('Please paste a valid Telegram link!');
                return;
            }

            let payload = "";
            try {
                const urlObj = new URL(rawTgLink);
                payload = urlObj.searchParams.get("start") || "";
            } catch (e) {
                alert('Invalid URL format!');
                return;
            }

            if (!payload) {
                alert('The Telegram link must contain a ?start= parameter!');
                return;
            }

            const currentDomain = window.location.origin;
            const gatewayUrl = `${currentDomain}/?get=${payload}`;
            const apiEndpoint = `https://gplinks.com/api?api=${GPLINKS_API_KEY}&url=${encodeURIComponent(gatewayUrl)}`;

            const outputDiv = document.getElementById('output');
            outputDiv.classList.remove('hidden');
            outputDiv.innerHTML = "Generating secure GPLink...";

            try {
                const response = await fetch(apiEndpoint);
                const data = await response.json();
                
                if (data.status === "success" && data.shortenedUrl) {
                    outputDiv.innerHTML = `<b>Success! Copy your GPLink:</b><br><a href="${data.shortenedUrl}" target="_blank" style="color:#22c55e;">${data.shortenedUrl}</a>`;
                } else {
                    outputDiv.innerHTML = `API Error: ${data.message || 'Could not generate link. Check API Key.'}`;
                }
            } catch (err) {
                outputDiv.innerHTML = `Network error. Check console or API settings.`;
            }
        }

        function onSuccess(token) {
            const urlParams = new URLSearchParams(window.location.search);
            const fileCode = urlParams.get('get') || '';

            if (!fileCode) {
                alert("No file payload found in link.");
                return;
            }

            const tgDeepLink = `tg://resolve?domain=${BOT_USERNAME}&start=${fileCode}`;
            const btn = document.getElementById('tg-btn');
            btn.href = tgDeepLink;
            btn.style.display = 'block';
            
            window.location.href = tgDeepLink;
        }
    </script>
</body>
</html>
