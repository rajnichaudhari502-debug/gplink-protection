<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification Portal</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; padding: 2.5rem 2rem; border-radius: 16px; text-align: center; max-width: 500px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        h2 { margin-bottom: 10px; font-size: 1.5rem; color: #38bdf8; }
        p { margin-bottom: 20px; font-size: 0.95rem; color: #94a3b8; line-height: 1.4; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; font-size: 0.95rem; }
        .cf-wrapper { display: flex; justify-content: center; margin: 20px 0; min-height: 65px; }
        .btn { width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-decoration: none; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); transition: background 0.2s; display: block; margin-top: 15px; }
        .btn:hover { background: #16a34a; }
        .admin-btn { background: #3b82f6; }
        .admin-btn:hover { background: #2563eb; }
        .danger-btn { background: #ef4444; }
        .danger-btn:hover { background: #dc2626; }
        .hidden { display: none !important; }
        .link-table { width: 100%; margin-top: 20px; text-align: left; border-collapse: collapse; font-size: 0.85rem; }
        .link-table th, .link-table td { padding: 10px; border-bottom: 1px solid #334155; word-break: break-all; }
        .link-table th { color: #38bdf8; }
        .actions button { padding: 5px 10px; font-size: 0.75rem; margin-right: 5px; width: auto; }
        .status-box { padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; color: #f59e0b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="user-view" class="card">
        <h2>Preparing Your File...</h2>
        <div id="status-msg" class="status-box">Checking browser security environment...</div>
        
        <div class="cf-wrapper" id="turnstile-container"></div>
        
        <div id="action-area" class="hidden">
            <p style="color: #22c55e; font-weight: bold;">Verification Successful!</p>
            <a id="tg-btn" class="btn" href="#">Open Telegram App</a>
        </div>
    </div>

    <div id="admin-view" class="card hidden" style="max-width: 750px;">
        <h2>Advanced Link Dashboard</h2>
        <p>Manage, generate, edit, and revoke your protected file links.</p>
        
        <div id="login-box">
            <input type="password" id="admin-pass" placeholder="Enter Admin Password">
            <button class="btn admin-btn" onclick="verifyAdmin()">Login</button>
        </div>

        <div id="generator-box" class="hidden">
            <input type="text" id="link-title" placeholder="File Name / Description (e.g. Episode 1)">
            <input type="text" id="tg-link" placeholder="Paste Telegram Bot Link (e.g. https://t.me/Bot?start=xyz)">
            <button class="btn admin-btn" onclick="generateAndSaveLink()">Generate & Save Link</button>
            
            <h3 style="margin-top:25px; color:#f8fafc; font-size:1.1rem; text-align:left;">Managed Links Database</h3>
            <div style="max-height: 300px; overflow-y: auto;">
                <table class="link-table">
                    <thead>
                        <tr>
                            <th>Title / Payload</th>
                            <th>Links</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="link-list">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "wtfnxfx"; 
        const GPLINKS_API_KEY = "cc346941b13df1daa7da298d55231228fa92b359";   
        const BOT_USERNAME = "Atoz_12_FileStore_Bot";   
        const SITE_KEY = "0x4AAAAAAFZbC01RvFSGeu7w"; 

        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash.includes('admin') || window.location.pathname.includes('admin')) {
                document.getElementById('user-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
            } else {
                initUserFlow();
            }
        });

        function initUserFlow() {
            // Read token from hidden hash fragment (#token=XYZ) instead of query parameters
            const hashVal = window.location.hash.substring(1); // remove #
            const params = new URLSearchParams(hashVal);
            const token = params.get('token');

            if (!token) {
                document.getElementById('status-msg').innerHTML = "Error: Invalid or missing secure token.";
                return;
            }

            sessionStorage.setItem('secure_target', token);
            window.location.hash = ''; // Clear hash from browser bar instantly

            setTimeout(() => {
                document.getElementById('status-msg').innerText = "Please complete the human check below:";
                renderTurnstile();
            }, 800);
        }

        function renderTurnstile() {
            const checkInterval = setInterval(() => {
                if (window.turnstile) {
                    clearInterval(checkInterval);
                    window.turnstile.render('#turnstile-container', {
                        sitekey: SITE_KEY,
                        callback: function(token) {
                            verifySolvedState(token);
                        },
                    });
                }
            }, 100);
        }

        function verifySolvedState(cfToken) {
            if (!cfToken) return;

            document.getElementById('turnstile-container').classList.add('hidden');
            document.getElementById('status-msg').classList.add('hidden');
            document.getElementById('action-area').classList.remove('hidden');

            const fileCode = sessionStorage.getItem('secure_target');
            const tgDeepLink = `tg://resolve?domain=${BOT_USERNAME}&start=${fileCode}`;
            
            const btn = document.getElementById('tg-btn');
            btn.href = tgDeepLink;
            window.location.href = tgDeepLink;
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('generator-box').classList.remove('hidden');
                renderLinks();
            } else {
                alert('Incorrect Password!');
            }
        }

        function getDatabase() {
            return JSON.parse(localStorage.getItem('gplink_db') || '{}');
        }

        function saveDatabase(db) {
            localStorage.setItem('gplink_db', JSON.stringify(db));
        }

        async function generateAndSaveLink() {
            const title = document.getElementById('link-title').value.trim() || "Untitled File";
            const rawTgLink = document.getElementById('tg-link').value.trim();
            
            let payload = "";
            try {
                const urlObj = new URL(rawTgLink);
                payload = urlObj.searchParams.get("start") || "";
            } catch (e) {
                alert('Invalid Telegram Link format!');
                return;
            }

            if (!payload) {
                alert('Link must contain a ?start= payload!');
                return;
            }

            const currentDomain = window.location.origin;
            // Uses hash fragment (#token=) so scrapers cannot see it in requests
            const rawVercelUrl = `${currentDomain}/#token=${payload}`;
            
            const apiEndpoint = `https://gplinks.com/api?api=${GPLINKS_API_KEY}&url=${encodeURIComponent(rawVercelUrl)}`;
            
            let finalGPLink = rawVercelUrl; 
            try {
                const response = await fetch(apiEndpoint);
                const data = await response.json();
                if (data.status === "success" && data.shortenedUrl) {
                    finalGPLink = data.shortenedUrl;
                }
            } catch(err) {
                console.log("GPLinks API warning.");
            }

            const db = getDatabase();
            db[payload] = { title, rawVercelUrl, finalGPLink };
            saveDatabase(db);

            document.getElementById('link-title').value = '';
            document.getElementById('tg-link').value = '';
            renderLinks();
            alert('Fully Protected Hash Link generated & saved!');
        }

        function renderLinks() {
            const db = getDatabase();
            const listEl = document.getElementById('link-list');
            listEl.innerHTML = '';

            for (const [payload, data] of Object.entries(db)) {
                listEl.innerHTML += `
                    <tr>
                        <td><b>${data.title}</b><br><span style="color:#94a3b8; font-size:0.75rem;">Payload: ${payload}</span></td>
                        <td>
                            <a href="${data.rawVercelUrl}" target="_blank" style="color:#38bdf8;">Raw Vercel Link</a><br>
                            <a href="${data.finalGPLink}" target="_blank" style="color:#22c55e;">GPLink</a>
                        </td>
                        <td class="actions">
                            <button class="btn admin-btn" onclick="editLink('${payload}')">Edit</button>
                            <button class="btn danger-btn" onclick="revokeLink('${payload}')">Revoke</button>
                        </td>
                    </tr>
                `;
            }
        }

        function revokeLink(payload) {
            if (confirm("Are you sure you want to revoke/delete this link?")) {
                const db = getDatabase();
                delete db[payload];
                saveDatabase(db);
                renderLinks();
            }
        }

        function editLink(payload) {
            const db = getDatabase();
            const newTitle = prompt("Edit File Name / Description:", db[payload].title);
            if (newTitle !== null) {
                db[payload].title = newTitle;
                saveDatabase(db);
                renderLinks();
            }
        }
    </script>
</body>
</html>
